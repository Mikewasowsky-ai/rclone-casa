<h1>Política de privacidad</h1>
<p>rclone-casa solo lo usa su propietario, con su propia cuenta de Google.</p>
<p>Los archivos de Google Drive se leen y se escriben desde su equipo con rclone.
No se recogen, no se guardan en ningún servidor ajeno y no se comparten con terceros.</p>
